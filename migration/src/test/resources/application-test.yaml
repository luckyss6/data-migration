# Source: H2 in Oracle compatibility mode, target: H2 in MySQL compatibility mode.
spring:
  main:
    keep-alive: false

migration:
  cron: "0 0 3 * * ?"
  threads: 2
  batch-size: 500
  fetch-size: 50
  target-table-pattern: "{table}{date}"
  date-pattern: yyyyMMdd
  date-offset-days: 0
  id-column: ID
  table-options: ""
  source:
    url: jdbc:h2:mem:migration_source;MODE=Oracle;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    pool-size: 2
  target:
    url: jdbc:h2:mem:migration_target;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    pool-size: 4
